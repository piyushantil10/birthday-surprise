
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday Harshita ❤️</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <!-- ================================= -->
    <!-- FIRST SCREEN -->
    <!-- ================================= -->

    <section id="welcome"
             class="screen">

        <div class="welcome-content">

            <p class="small-text">
                Hey... 👀
            </p>


            <h1>

                I made something

                <br>

                <span>
                    just for you ❤️
                </span>

            </h1>


            <p class="subtitle">

                There is a little surprise
                waiting for you...

            </p>


            <button id="openBtn">

                Open Your Surprise ✨

            </button>

        </div>

    </section>



    <!-- ================================= -->
    <!-- BIRTHDAY SCREEN -->
    <!-- ================================= -->

    <section id="birthday"
             class="screen hidden">

        <div class="birthday-content">


            <!-- GIFT -->

            <div class="gift">

                🎁

            </div>


            <!-- BIRTHDAY TITLE -->

            <h1 class="birthday-title">

                Happy Birthday

            </h1>


            <!-- HER NAME -->

            <h2 class="her-name">

                HARSHITA ❤️

            </h2>


            <p>

                Today is your special day...

            </p>


            <!-- NEXT BUTTON -->

            <button id="memoryBtn">

                See Your Surprise 📸

            </button>


        </div>

    </section>



    <!-- ================================= -->
    <!-- MEMORY SCREEN -->
    <!-- ================================= -->

    <section id="memories"
             class="section hidden">


        <div class="memories-container">


            <h1 class="memory-title">

                Some Beautiful Moments ❤️

            </h1>


            <p class="section-subtitle">

                A few pictures of someone
                who deserves a beautiful birthday.

            </p>


            <!-- SINGLE GENERATED IMAGE -->

            <div class="single-memory-image">

                <img src="images/birthday-memories.png"
                     alt="Beautiful Birthday Memories">

            </div>


            <!-- MESSAGE BUTTON -->

            <button id="messageBtn">

                One Last Thing 💌

            </button>


        </div>

    </section>



    <!-- ================================= -->
    <!-- FINAL MESSAGE SCREEN -->
    <!-- ================================= -->

    <section id="message"
             class="screen hidden">


        <div class="message-box">


            <h1>

                For You ❤️

            </h1>


            <p id="typingText"></p>


            <div class="final-line">

                Happy Birthday once again 🎂✨

            </div>


            <div class="hearts">

                ❤️ 💕 ❤️ 💕 ❤️

            </div>


        </div>

    </section>



    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="script.js"></script>


</body>

</html>
